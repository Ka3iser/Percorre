<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div{
            background-color: #676767;
            color: hotpink;
        }
        body{
            background-color: #6767;
        }
    </style>
    <title>HTML Semantico</title>
</head>
<body>
    <h1>HTML Semântico</h1>
    <!-- Serve pra criar texto inline generica -->
    <span>Olá</span>
    <span>Arthur</span>
    <!-- Serve pra criar parágrafos -->
    <p>asdf</p>
    <!-- cria uma divisão generica -->
    <div> <!-- sessão pra falar sobre fonte -->
        <h2>Fontes 550w</h2>
        <p>Corsair</p>
        <p>Rise</p>
        <p>MSI</p>
    </div>
</body>
</html>
