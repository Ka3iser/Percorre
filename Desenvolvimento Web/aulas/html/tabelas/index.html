<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabelas</title>
    </head>
    <body>
        <h1>Tabelas</h1>
        <!-- tabela -->
        <table border="4" width="50%" height="200px" align="center">
            <tr align="center">
                <!-- linha 1 -->
                <td>
                    <p>Amanda</p>
                </td>
                <!-- linha 2 -->
                <td>
                    <p>Arthur</p>
                </td>
            </tr>
            <tr align="center">
                <td>
                    <p>Jojo</p>
                </td>
                <td>
                    <p>Carros</p>
                </td>
            </tr>
        </table>

        <hr>

        <!-- section de pratica -->
        <section>
            <h2 align="center">Titulo</h2>
            <table width="100%" border="1" height="300px" cellspacing="0px" cellpadding="1">
                <tr>
                    <td bgcolor="EF476F"></td>
                    <td bgcolor="FFD166"></td>
                    <td bgcolor="118AB2"></td>
                </tr>
            </table>
        </section>
    </body>
</html>
