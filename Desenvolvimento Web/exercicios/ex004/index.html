<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios Github</title>
</head>
<body>
    <h1>Crie sua conta</h1>
    <!-- Login por fora -->
    <button>Conectar com Google</button>
    <br>
    <br>
    <button>Conectar com Apple</button>
    <hr>
    <br>
    <pre>                                                                                                Ou</pre>
    <form>
        <label for="email">E-mail</label><br>
        <input type="text" required>
        <br>
        <br>
        <label for="senha">Senha</label><br>
        <input type="text" required>
        <br>
        <br>
        <label for="username">Nome de Usuário</label><br>
        <input type="text">
        <br>
        <p>Sua Região</p>
        <select name="regiao" id="regiao">
            <option value="brasil">Brasil</option>
            <option value="eua">EUA</option>
            <option value="mexico">México</option>
            <option value="russia">Rússia</option>
        </select>
        <br>
        <br>
        <p>Assistente de Programação</p>
        <input type="checkbox" name="ia" id="ia">
        <label for="ia">Quer receber acesso ao assistende de programação gratuito</label>
        <br>
        <a href="#">Ver termos</a>
        <p>Preferencia de e-mail</p>
        <input type="checkbox" name="novidades" id="novidades">
        <label for="novidades">Quer receber novidades e atualizações por email</label>
        <br>
        <br>
        <button type="submit">Criar conta </button>
    </form>
    <br>
    <small>Ao criar uma conta, você aceita com os <a href="#">Termos de serviço</a> e com a <a href="#">Politica de privacidade</a></small>
</body>
</html>
